version: '3.8'

services:
  artemis:
    image: apache/activemq-artemis:latest
    container_name: stomp-test-artemis
    environment:
      # Set admin credentials
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      # Allow anonymous connections for testing
      ANONYMOUS_LOGIN: true
    ports:
      # STOMP port
      - "61613:61613"
      # Web management console
      - "8161:8161"
      # OpenWire (JMS) port  
      - "61616:61616"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8161/console/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - stomp-test

networks:
  stomp-test:
    driver: bridge

# Usage Examples:
#
# Start Artemis:
#   docker-compose -f docker-compose.test.yml up -d
#
# Run integration tests:
#   docker-compose -f docker-compose.test.yml up -d
#   make test-integration
#
# Stop and cleanup:
#   docker-compose -f docker-compose.test.yml down
#
# View logs:
#   docker-compose -f docker-compose.test.yml logs artemis
#
# Access management console:
#   http://localhost:8161/console/ (admin/admin) 